<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONNECT FOUR</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf2ff;background:#0b1224}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#233a66,#0b1224 70%);display:grid;place-items:center;padding:18px}.wrap{width:min(100%,760px)}header{text-align:center;margin-bottom:16px}h1{font-size:clamp(30px,7vw,54px);letter-spacing:.13em;margin:0}header p{opacity:.65;margin:6px}.panel{background:#ffffff0d;border:1px solid #ffffff20;border-radius:20px;padding:16px;box-shadow:0 20px 65px #0005}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:14px}select,button{background:#243657;border:1px solid #60749a;color:white;padding:10px 13px;border-radius:11px;font:inherit;cursor:pointer}button:hover,select:hover{background:#34507f}button:focus-visible,select:focus-visible{outline:3px solid #fff}label{font-size:14px}.status{text-align:center;min-height:28px;font-weight:700;margin:8px 0 12px}.stage{position:relative;width:100%;aspect-ratio:7/6;touch-action:manipulation;user-select:none}.stage canvas{display:block;width:100%;height:100%;border-radius:15px;cursor:pointer}.hint{text-align:center;color:#aebdd6;font-size:13px;margin:14px 0 0}.legend{display:flex;justify-content:center;gap:22px;margin-top:12px;font-size:14px}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:5px}.red{background:#ff586d}.yellow{background:#ffd45c}@media(max-width:480px){.panel{padding:10px}.controls{gap:7px}select,button{padding:9px 8px;font-size:13px}}
</style></head><body><main class="wrap"><header><h1>CONNECT FOUR</h1><p>4つ並べて、勝利をつかめ。</p></header><section class="panel"><div class="controls"><label>対戦 <select id="mode"><option value="cpu">CPU対戦</option><option value="pvp">2人対戦</option></select></label><label>CPUレベル <select id="level"><option value="1">1 初心者</option><option value="2">2 やさしい</option><option value="3" selected>3 ふつう</option><option value="4">4 強い</option><option value="5">5 最強</option></select></label><button id="restart">最初から</button><button id="undo">1手戻す</button></div><div class="status" id="status" aria-live="polite"></div><div class="stage"><canvas id="game" aria-label="四目並べの盤面。列をクリックしてコマを落とす"></canvas></div><div class="legend"><span><i class="dot red"></i>プレイヤー1</span><span><i class="dot yellow"></i><span id="opponent">CPU</span></span></div><p class="hint">列をタップしてコマを落とします。キーボードの1〜7でも操作できます。</p></section></main>
<script>
(()=>{'use strict';
const ROWS=6,COLS=7,canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),mode=document.getElementById('mode'),level=document.getElementById('level'),opponent=document.getElementById('opponent');
let board,turn,history,over,winCells,falling,hover=-1,thinking=false,request=0,frame=0;
const colors=['','#ff526c','#ffd24c'];
const legal=b=>Array.from({length:COLS},(_,c)=>c).filter(c=>b[0][c]===0);
function drop(b,c,p){for(let r=ROWS-1;r>=0;r--)if(!b[r][c]){b[r][c]=p;return r}return -1}
function winner(b){const dirs=[[1,0],[0,1],[1,1],[1,-1]];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(!p)continue;for(const [dr,dc] of dirs){let cells=[[r,c]];for(let k=1;k<4;k++){const y=r+dr*k,x=c+dc*k;if(y<0||y>=ROWS||x<0||x>=COLS||b[y][x]!==p)break;cells.push([y,x])}if(cells.length===4)return {p,cells}}}return null}
function reset(){request++;board=Array.from({length:ROWS},()=>Array(COLS).fill(0));turn=1;history=[];over=false;winCells=[];falling=null;thinking=false;hover=-1;status.textContent='赤の番です';render()}
function startMove(c){if(over||falling||thinking||!legal(board).includes(c))return;if(mode.value==='cpu'&&turn===2)return;commit(c)}
function commit(c){const before=board.map(row=>row.slice());const r=drop(board,c,turn);if(r<0)return;history.push({before,turn});falling={r,c,p:turn,y:-.9,v:0,bounce:0};status.textContent='コマが落下中…';animate()}
function settle(){const w=winner(board);falling=null;if(w){over=true;winCells=w.cells;status.textContent=w.p===1?'赤の勝利！':(mode.value==='cpu'?'CPUの勝利！':'黄色の勝利！')}else if(legal(board).length===0){over=true;status.textContent='引き分けです'}else{turn=3-turn;status.textContent=turn===1?'赤の番です':(mode.value==='cpu'?'CPUが考えています…':'黄色の番です');if(mode.value==='cpu'&&turn===2){thinking=true;const token=++request;setTimeout(()=>{if(token!==request||over)return;const c=choose(board,Number(level.value));thinking=false;commit(c)},360)}}render()}
function animate(){if(!falling)return;const f=falling;f.v+=.065;f.y+=f.v;if(f.y>=f.r){f.y=f.r;if(Math.abs(f.v)>.22&&f.bounce<3){f.v=-f.v*.31;f.bounce++}else{settle();return}}render();frame=requestAnimationFrame(animate)}
function evaluate(b,p){let score=0;for(let r=0;r<ROWS;r++)if(b[r][3]===p)score+=5;const dirs=[[1,0],[0,1],[1,1],[1,-1]];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const [dr,dc] of dirs){const rr=r+dr*3,cc=c+dc*3;if(rr<0||rr>=ROWS||cc<0||cc>=COLS)continue;let mine=0,enemy=0;for(let k=0;k<4;k++){const v=b[r+dr*k][c+dc*k];if(v===p)mine++;else if(v)enemy++}if(mine&&enemy)continue;if(mine)score+=[0,1,7,75,100000][mine];if(enemy)score-=[0,1,8,90,100000][enemy]}return score}
function minimax(b,depth,alpha,beta,maximizing){const w=winner(b);if(w)return w.p===2?1000000+depth:-1000000-depth;const moves=legal(b);if(!depth||!moves.length)return evaluate(b,2);moves.sort((a,z)=>Math.abs(a-3)-Math.abs(z-3));if(maximizing){let best=-Infinity;for(const c of moves){const t=b.map(x=>x.slice());drop(t,c,2);best=Math.max(best,minimax(t,depth-1,alpha,beta,false));alpha=Math.max(alpha,best);if(beta<=alpha)break}return best}else{let best=Infinity;for(const c of moves){const t=b.map(x=>x.slice());drop(t,c,1);best=Math.min(best,minimax(t,depth-1,alpha,beta,true));beta=Math.min(beta,best);if(beta<=alpha)break}return best}}
function choose(b,lvl){const moves=legal(b);if(moves.length===1)return moves[0];const shuffled=moves.map(c=>({c,k:Math.random()})).sort((a,z)=>a.k-z.k).map(x=>x.c);if(lvl===1)return shuffled[0];for(const c of shuffled){const t=b.map(x=>x.slice());drop(t,c,2);if(winner(t)?.p===2)return c}if(lvl>=2){for(const c of shuffled){const t=b.map(x=>x.slice());drop(t,c,1);if(winner(t)?.p===1)return c}}if(lvl===2)return Math.random()<.55?shuffled[0]:moves.reduce((a,c)=>Math.abs(c-3)<Math.abs(a-3)?c:a,moves[0]);const depth={3:2,4:4,5:6}[lvl];let best=-Infinity,choices=[];for(const c of shuffled){const t=b.map(x=>x.slice());drop(t,c,2);let val=minimax(t,depth-1,-Infinity,Infinity,false);val+=(3-Math.abs(c-3))*1.5;if(lvl===3)val+=Math.random()*18;if(val>best+.001){best=val;choices=[c]}else if(Math.abs(val-best)<.001)choices.push(c)}return choices[Math.floor(Math.random()*choices.length)]}
function dimensions(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);return {w:rect.width,h:rect.height,cell:rect.width/COLS}}
function circle(x,y,r,p){const g=ctx.createRadialGradient(x-r*.28,y-r*.35,r*.08,x,y,r);if(p===1){g.addColorStop(0,'#ffb0b7');g.addColorStop(.52,'#ff526c');g.addColorStop(1,'#ae2447')}else{g.addColorStop(0,'#fff8bf');g.addColorStop(.55,'#ffd24c');g.addColorStop(1,'#b77712')}ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=Math.max(1,r*.08);ctx.strokeStyle='#ffffff55';ctx.stroke();ctx.beginPath();ctx.arc(x-r*.2,y-r*.25,r*.52,3.55,5.2);ctx.strokeStyle='#ffffff75';ctx.lineWidth=r*.12;ctx.stroke()}
function render(){const {w,h,cell}=dimensions(),top=(h-cell*ROWS)/2;ctx.clearRect(0,0,w,h);ctx.fillStyle='#101d36';ctx.fillRect(0,0,w,h);if(hover>=0&&!over&&!thinking&&!falling&&legal(board).includes(hover)){ctx.fillStyle='#ffffff12';ctx.fillRect(hover*cell,0,cell,h)}for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=(c+.5)*cell,y=top+(r+.5)*cell,rad=cell*.4;if(board[r][c]&&!(falling?.r===r&&falling?.c===c))circle(x,y,rad,board[r][c]);else{ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fillStyle='#081329';ctx.fill()}}if(falling)circle((falling.c+.5)*cell,top+(falling.y+.5)*cell,cell*.4,falling.p);
ctx.fillStyle='#2674db';ctx.beginPath();const radius=Math.min(18,cell*.18);ctx.roundRect(0,top,w,ROWS*cell,radius);for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ctx.moveTo((c+.5)*cell+cell*.43,top+(r+.5)*cell);ctx.arc((c+.5)*cell,top+(r+.5)*cell,cell*.43,0,Math.PI*2,true)}ctx.fill('evenodd');ctx.strokeStyle='#78b7ff88';ctx.lineWidth=3;ctx.strokeRect(1,top+1,w-2,ROWS*cell-2);
if(winCells.length){ctx.strokeStyle='#7dffbf';ctx.lineWidth=4;for(const [r,c] of winCells){ctx.beginPath();ctx.arc((c+.5)*cell,top+(r+.5)*cell,cell*.39,0,Math.PI*2);ctx.stroke()}}}
canvas.addEventListener('pointermove',e=>{const rect=canvas.getBoundingClientRect();const c=Math.floor((e.clientX-rect.left)/rect.width*COLS);if(c!==hover){hover=c;render()}});canvas.addEventListener('pointerleave',()=>{hover=-1;render()});canvas.addEventListener('click',e=>{const rect=canvas.getBoundingClientRect();startMove(Math.floor((e.clientX-rect.left)/rect.width*COLS))});window.addEventListener('keydown',e=>{if(/^[1-7]$/.test(e.key)&&!e.altKey&&!e.ctrlKey)startMove(Number(e.key)-1)});document.getElementById('restart').onclick=reset;document.getElementById('undo').onclick=()=>{if(falling||!history.length)return;request++;cancelAnimationFrame(frame);let steps=mode.value==='cpu'&&turn===1?2:1;while(steps--&&history.length){const h=history.pop();board=h.before;turn=h.turn}over=false;winCells=[];thinking=false;falling=null;status.textContent=turn===1?'赤の番です':'黄色の番です';render()};mode.onchange=()=>{opponent.textContent=mode.value==='cpu'?'CPU':'プレイヤー2';level.disabled=mode.value!=='cpu';reset()};level.onchange=reset;window.addEventListener('resize',render);reset();
})();
</script></body></html>
